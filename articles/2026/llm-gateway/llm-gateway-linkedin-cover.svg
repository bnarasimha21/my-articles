<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f1733"/>
      <stop offset="55%" stop-color="#070a1a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2240" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <radialGradient id="gridFade" cx="72%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="720" fill="url(#gridFade)"/></mask>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9cc3ff"/>
      <stop offset="55%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#ffb454"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#3a6fff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3a6fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#cfe3ff"/>
      <stop offset="55%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#22307a"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laneBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7fb3ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="laneAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="inLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fb3ff" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titleGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
  <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="150" cy="660" r="220" fill="#1f3a8a" opacity="0.18" filter="url(#blur40)"/>
  <circle cx="1120" cy="250" r="160" fill="#ff9a3c" opacity="0.07" filter="url(#blur40)"/>

  <!-- incoming calls -->
  <g><path d="M758 200 C810 200 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 260 C810 260 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 320 C810 320 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 380 C810 380 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 440 C810 440 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 500 C810 500 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
<path d="M758 560 C810 560 820 380 850 380" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
</g>
  <g><g transform="translate(700 188)" opacity="0.45"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="30" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="22" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 248)" opacity="0.6"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="37" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="33" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 308)" opacity="0.8"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="30" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="24" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 368)" opacity="1"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="37" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="35" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 428)" opacity="0.8"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="30" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="26" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 488)" opacity="0.6"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="37" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="37" height="3" rx="1.5" fill="#3b52a0"/></g>
<g transform="translate(700 548)" opacity="0.45"><rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/><rect x="8" y="8" width="30" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="28" height="3" rx="1.5" fill="#3b52a0"/></g>
</g>

  <!-- retry loops (amber) on the gateway -->
  <g fill="none" stroke="#ffb454" stroke-linecap="round" filter="url(#glow)">
    <path d="M870 300 C840 250 940 230 930 290" stroke-width="2" opacity="0.9"/>
    <path d="M924 282 L930 292 L937 281" stroke-width="2"/>
    <path d="M880 465 C850 520 950 535 935 470" stroke-width="1.6" opacity="0.6"/>
    <path d="M929 478 L935 468 L942 479" stroke-width="1.6" opacity="0.6"/>
  </g>

  <!-- gateway node -->
  <g transform="translate(910 380)">
    <circle r="150" fill="url(#coreGlow)"/>
    <circle r="104" fill="none" stroke="#7fb3ff" stroke-width="0.6" opacity="0.2" stroke-dasharray="2 6"/>
    <rect x="-56" y="-56" width="112" height="112" rx="22" fill="url(#core)"/>
    <rect x="-56" y="-56" width="112" height="112" rx="22" fill="none" stroke="#bcd6ff" stroke-width="1.4" opacity="0.7"/>
    <text y="-4" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="14" font-weight="bold" fill="#0b1240" letter-spacing="1">GATEWAY</text>
    <text y="16" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#0b1240">retry·limit·log</text>
  </g>

  <!-- outputs -->
  <g fill="none" stroke-linecap="round">
    <path d="M966 380 C1020 380 1030 250 1082 250" stroke="url(#laneBlue)" stroke-width="3" filter="url(#glow)"/>
    <path d="M966 380 C1020 380 1030 350 1082 350" stroke="url(#laneBlue)" stroke-width="1.6" stroke-dasharray="5 6"/>
    <path d="M966 380 C1020 380 1030 470 1082 470" stroke="url(#redLine)" stroke-width="1.6"/>
    <path d="M966 380 C1010 400 1030 580 1082 580" stroke="#c9d4f5" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.7"/>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="14">
    <g transform="translate(1084 233)"><rect width="150" height="34" rx="17" fill="#0f1838" stroke="#7fb3ff" stroke-width="1.4"/><circle cx="18" cy="17" r="4.5" fill="#7fb3ff"/><text x="32" y="22" fill="#cfe3ff" font-weight="bold">primary</text></g>
    <g transform="translate(1084 334)"><rect width="150" height="32" rx="16" fill="#0d1430" stroke="#34478a"/><circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/><text x="30" y="21" fill="#aab8de">fallback</text></g>
    <g transform="translate(1084 454)"><rect width="150" height="32" rx="16" fill="#2a0d10" stroke="#ff6b6b" stroke-width="1.2"/><circle cx="17" cy="16" r="3.5" fill="#ff6b6b"/><text x="30" y="21" fill="#ffb3b3">429 · 529</text></g>
    <g transform="translate(1084 564)"><rect width="150" height="32" rx="16" fill="none" stroke="#c9d4f5" stroke-dasharray="4 4" opacity="0.8"/><text x="18" y="21" fill="#dfe6fb">rules → 👤</text></g>
  </g>

  <!-- text -->
  <g transform="translate(80 140)">
    <rect x="0" y="-2" width="36" height="2" rx="1" fill="#7fb3ff"/>
    <text x="48" y="4" font-family="Inter, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#9cc3ff">LLM GATEWAY · 9AM MONDAY</text>
  </g>
  <text x="74" y="272" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-3">200/200</text>
  <rect x="452" y="198" width="2" height="78" rx="1" fill="#7fb3ff" opacity="0.5"/>
  <g font-family="Inter, sans-serif">
    <text x="472" y="219" font-size="15" font-weight="600" fill="#9cc3ff" letter-spacing="2.5">CALLS DELIVERED</text>
    <text x="472" y="247" font-size="19" fill="#8aa0d6">with 20% of attempts</text>
    <text x="472" y="272" font-size="19" fill="#8aa0d6">failing on purpose</text>
  </g>
  <g transform="translate(130 300)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#4b67c4" stroke-width="2" stroke-dasharray="3 5"/>
    <path d="M-7 34 L0 44 L7 34" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="74" y="444" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#titleGrad2)" letter-spacing="-3">+25%</text>
  <rect x="452" y="370" width="2" height="78" rx="1" fill="#ffb454" opacity="0.5"/>
  <g font-family="Inter, sans-serif">
    <text x="472" y="391" font-size="15" font-weight="600" fill="#ffb454" letter-spacing="2.5">CACHING COST MORE</text>
    <text x="472" y="419" font-size="19" fill="#c79a5c">one timestamp at the</text>
    <text x="472" y="444" font-size="19" fill="#c79a5c">top of the prompt</text>
  </g>
  <text font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#e6ecff" letter-spacing="-0.3">
    <tspan x="80" y="536">Retries hide blips.</tspan>
    <tspan x="80" dy="32">They don't fix outages.</tspan>
  </text>
  <g transform="translate(80 660)">
    <circle cx="10" cy="0" r="10" fill="#7fb3ff" opacity="0.25"/>
    <circle cx="10" cy="0" r="4" fill="#7fb3ff"/>
    <text x="30" y="6" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#aab8de" letter-spacing="0.5">Narasimha Badrinath</text>
  </g>
</svg>
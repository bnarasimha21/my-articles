<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="70%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f1733"/>
      <stop offset="55%" stop-color="#070a1a"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a2240" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <radialGradient id="gridFade" cx="72%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="720" fill="url(#gridFade)"/></mask>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9cc3ff"/>
      <stop offset="55%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#ffb454"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#3a6fff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3a6fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#cfe3ff"/>
      <stop offset="55%" stop-color="#6aa8ff"/>
      <stop offset="100%" stop-color="#22307a"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="laneBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7fb3ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="laneAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="inLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fb3ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fb3ff" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titleGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="100%" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="150" cy="660" r="220" fill="#1f3a8a" opacity="0.18" filter="url(#blur40)"/>
  <circle cx="1120" cy="250" r="160" fill="#ff9a3c" opacity="0.07" filter="url(#blur40)"/>

  <!-- ============ ROUTER VISUAL (right) ============ -->
  <!-- Incoming ticket stream -->
  <g>
    <path d="M700 250 C770 250 790 360 860 360" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
    <path d="M690 310 C770 310 800 360 860 360" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
    <path d="M685 370 C770 370 800 360 860 360" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
    <path d="M690 430 C770 430 800 360 860 360" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
    <path d="M700 490 C770 490 790 360 860 360" fill="none" stroke="url(#inLine)" stroke-width="1.4"/>
  </g>
  <!-- ticket cards -->
  <g font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#8aa0d6">
    <g transform="translate(640 238)" opacity="0.55">
      <rect width="58" height="24" rx="5" fill="#0d1430" stroke="#2c3d78"/>
      <rect x="8" y="8" width="30" height="3" rx="1.5" fill="#4a64b0"/><rect x="8" y="14" width="40" height="3" rx="1.5" fill="#2f4280"/>
    </g>
    <g transform="translate(628 298)" opacity="0.75">
      <rect width="58" height="24" rx="5" fill="#0d1430" stroke="#34478a"/>
      <rect x="8" y="8" width="38" height="3" rx="1.5" fill="#4a64b0"/><rect x="8" y="14" width="26" height="3" rx="1.5" fill="#2f4280"/>
    </g>
    <g transform="translate(622 358)">
      <rect width="58" height="24" rx="5" fill="#0f1838" stroke="#4b67c4"/>
      <rect x="8" y="8" width="34" height="3" rx="1.5" fill="#6a88e0"/><rect x="8" y="14" width="42" height="3" rx="1.5" fill="#3b52a0"/>
    </g>
    <g transform="translate(628 418)" opacity="0.75">
      <rect width="58" height="24" rx="5" fill="#0d1430" stroke="#34478a"/>
      <rect x="8" y="8" width="24" height="3" rx="1.5" fill="#4a64b0"/><rect x="8" y="14" width="40" height="3" rx="1.5" fill="#2f4280"/>
    </g>
    <g transform="translate(640 478)" opacity="0.55">
      <rect width="58" height="24" rx="5" fill="#0d1430" stroke="#2c3d78"/>
      <rect x="8" y="8" width="36" height="3" rx="1.5" fill="#4a64b0"/><rect x="8" y="14" width="22" height="3" rx="1.5" fill="#2f4280"/>
    </g>
  </g>

  <!-- Output lanes (node at 860,360 -> pills at x=1052) -->
  <g fill="none" stroke-linecap="round">
    <!-- billing: the pull -->
    <path d="M860 360 C950 360 960 150 1050 150" stroke="url(#laneAmber)" stroke-width="4" filter="url(#glow)"/>
    <path d="M860 360 C940 330 970 170 1050 156" stroke="#ffb454" stroke-width="1" opacity="0.45"/>
    <path d="M860 360 C930 300 980 180 1050 144" stroke="#ffb454" stroke-width="1" opacity="0.3"/>
    <!-- others -->
    <path d="M860 360 C950 360 960 218 1050 218" stroke="url(#laneBlue)" stroke-width="1.6"/>
    <path d="M860 360 C950 360 960 286 1050 286" stroke="url(#laneBlue)" stroke-width="1.6"/>
    <path d="M860 360 C950 360 960 354 1050 354" stroke="url(#laneBlue)" stroke-width="1.6"/>
    <path d="M860 360 C950 360 960 422 1050 422" stroke="url(#laneBlue)" stroke-width="1.6"/>
    <path d="M860 360 C950 360 960 490 1050 490" stroke="url(#laneBlue)" stroke-width="1.6"/>
    <!-- unsure: to human -->
    <path d="M860 360 C930 380 960 590 1050 590" stroke="#c9d4f5" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.7"/>
  </g>

  <!-- particles drifting into billing -->
  <g fill="#ffcf8a" filter="url(#glow)">
    <circle cx="935" cy="262" r="3"/>
    <circle cx="968" cy="205" r="2.4" opacity="0.85"/>
    <circle cx="1002" cy="168" r="2.8"/>
    <circle cx="955" cy="300" r="2" opacity="0.6"/>
  </g>
  <g fill="#9cc3ff">
    <circle cx="990" cy="300" r="2.2" opacity="0.8"/>
    <circle cx="1000" cy="430" r="2.2" opacity="0.7"/>
  </g>

  <!-- Router node -->
  <g transform="translate(860 360)">
    <circle r="150" fill="url(#coreGlow)"/>
    <circle r="78" fill="none" stroke="#7fb3ff" stroke-width="0.8" opacity="0.35"/>
    <circle r="104" fill="none" stroke="#7fb3ff" stroke-width="0.6" opacity="0.2" stroke-dasharray="2 6"/>
    <circle r="50" fill="url(#core)"/>
    <circle r="50" fill="none" stroke="#bcd6ff" stroke-width="1.4" opacity="0.7"/>
    <ellipse cx="-15" cy="-18" rx="20" ry="13" fill="#ffffff" opacity="0.35"/>
    <text y="6" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="15" font-weight="bold" fill="#0b1240" letter-spacing="1">LLM</text>
  </g>

  <!-- Queue pills -->
  <g font-family="'DejaVu Sans Mono', monospace" font-size="14">
    <!-- billing highlighted -->
    <g transform="translate(1052 133)">
      <circle cx="58" cy="17" r="70" fill="url(#amberGlow)"/>
      <rect width="118" height="34" rx="17" fill="#2a1a08" stroke="#ffb454" stroke-width="1.6"/>
      <circle cx="18" cy="17" r="4.5" fill="#ffb454"/>
      <text x="32" y="22" fill="#ffd9a0" font-weight="bold">billing</text>
    </g>
    <g transform="translate(1052 202)">
      <rect width="88" height="32" rx="16" fill="#0d1430" stroke="#34478a"/>
      <circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/>
      <text x="30" y="21" fill="#aab8de">bug</text>
    </g>
    <g transform="translate(1052 270)">
      <rect width="104" height="32" rx="16" fill="#0d1430" stroke="#34478a"/>
      <circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/>
      <text x="30" y="21" fill="#aab8de">how_to</text>
    </g>
    <g transform="translate(1052 338)">
      <rect width="168" height="32" rx="16" fill="#0d1430" stroke="#34478a"/>
      <circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/>
      <text x="30" y="21" fill="#aab8de">account_access</text>
    </g>
    <g transform="translate(1052 406)">
      <rect width="176" height="32" rx="16" fill="#0d1430" stroke="#34478a"/>
      <circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/>
      <text x="30" y="21" fill="#aab8de">feature_request</text>
    </g>
    <g transform="translate(1052 474)">
      <rect width="148" height="32" rx="16" fill="#0d1430" stroke="#34478a"/>
      <circle cx="17" cy="16" r="3.5" fill="#7fb3ff"/>
      <text x="30" y="21" fill="#aab8de">cancellation</text>
    </g>
    <!-- unsure -> human -->
    <g transform="translate(1052 574)">
      <rect width="150" height="32" rx="16" fill="none" stroke="#c9d4f5" stroke-dasharray="4 4" opacity="0.8"/>
      <text x="18" y="21" fill="#dfe6fb">unsure → 👤</text>
    </g>
  </g>

  <!-- ============ TEXT (left) ============ -->
  <g transform="translate(80 140)">
    <rect x="0" y="-2" width="36" height="2" rx="1" fill="#7fb3ff"/>
    <text x="48" y="4" font-family="Inter, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#9cc3ff">LLM TICKET ROUTING</text>
  </g>

  <!-- Hero stat 1 -->
  <text x="74" y="272" font-family="Inter, sans-serif" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="-3">92%</text>
  <rect x="392" y="198" width="2" height="78" rx="1" fill="#7fb3ff" opacity="0.5"/>
  <g font-family="Inter, sans-serif">
    <text x="412" y="219" font-size="15" font-weight="600" fill="#9cc3ff" letter-spacing="2.5">CLEAN TICKETS</text>
    <text x="412" y="247" font-size="19" font-weight="400" fill="#8aa0d6">40 hand-picked,</text>
    <text x="412" y="272" font-size="19" font-weight="400" fill="#8aa0d6">tuned against</text>
  </g>

  <!-- drop connector -->
  <g transform="translate(130 300)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#4b67c4" stroke-width="2" stroke-dasharray="3 5"/>
    <path d="M-7 34 L0 44 L7 34" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Hero stat 2 -->
  <text x="74" y="444" font-family="Inter, sans-serif" font-size="100" font-weight="800" fill="url(#titleGrad2)" letter-spacing="-3">~60%</text>
  <rect x="392" y="370" width="2" height="78" rx="1" fill="#ffb454" opacity="0.5"/>
  <g font-family="Inter, sans-serif">
    <text x="412" y="391" font-size="15" font-weight="600" fill="#ffb454" letter-spacing="2.5">MESSY TICKETS</text>
    <text x="412" y="419" font-size="19" font-weight="400" fill="#c79a5c">typos, two intents,</text>
    <text x="412" y="444" font-size="19" font-weight="400" fill="#c79a5c">"refund?"</text>
  </g>

  <text font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#e6ecff" letter-spacing="-0.3">
    <tspan x="80" y="536">One accuracy number can't tell you</tspan>
    <tspan x="80" dy="32">if it's ready.</tspan>
  </text>
  <!-- Byline -->
  <g transform="translate(80 660)">
    <circle cx="10" cy="0" r="10" fill="#7fb3ff" opacity="0.25"/>
    <circle cx="10" cy="0" r="4" fill="#7fb3ff"/>
    <text x="30" y="6" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#aab8de" letter-spacing="0.5">Narasimha Badrinath</text>
  </g>
</svg>
